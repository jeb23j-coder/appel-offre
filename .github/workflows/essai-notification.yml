name: Essai de notification

# À lancer à la main (onglet Actions) pour vérifier que les courriels de notification arrivent.
on:
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  essai:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
    steps:
      - run: |
          gh issue create -R "$GITHUB_REPOSITORY" --label notification --assignee "${{ github.repository_owner }}" \
            --title "Essai : notification Radar Chantier" \
            --body "Si vous recevez ce courriel, les notifications de Radar Chantier fonctionnent. Vous recevrez un message comme celui-ci dès qu'un nouveau contrat correspond à vos critères. Site : https://jeb23j-coder.github.io/appel-offre/"
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Content-Type: application/json" -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"Radar Chantier : essai de notification\",\"message\":\"Les notifications sur votre cellulaire fonctionnent.\",\"click\":\"https://jeb23j-coder.github.io/appel-offre/\",\"tags\":[\"bell\"]}" https://ntfy.sh/
          fi
