name: Courriel quotidien de minuit

# Un courriel par jour et par profil, envoyé au premier passage après minuit (heure du Québec).
# Le robot passe toutes les heures, car GitHub lance parfois les horaires en retard ; le script n'envoie qu'une fois par jour.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Envoyer maintenant (essai)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: config
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    env:
      CLE_PRIVEE: ${{ secrets.CLE_PRIVEE }}
      GMAIL_ADDRESS: ${{ vars.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet cryptography
      - name: Envoyer le résumé de minuit
        run: python scanner/resume.py ${{ inputs.force && '--force' || '' }}
      - name: Retenir que le résumé du jour est parti
        if: success()
        run: |
          git config user.name "radar-chantier-bot"
          git config user.email "radar-chantier-bot@users.noreply.github.com"
          [ -f data/resume.json ] || exit 0
          git add data/resume.json
          git diff --cached --quiet && exit 0
          git commit -m "Résumé quotidien envoyé"
          git pull --rebase --autostash
          git push
